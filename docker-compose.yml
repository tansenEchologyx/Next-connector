# Local PostgreSQL for Next Connector development.
# Production uses Neon; this Docker setup is for local dev and worker testing only.

services:
  postgres:
    image: postgres:16-alpine
    container_name: next-connector-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: next_connector
      POSTGRES_PASSWORD: next_connector
      POSTGRES_DB: next_connector
    volumes:
      - next_connector_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U next_connector -d next_connector"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  next_connector_pgdata:
